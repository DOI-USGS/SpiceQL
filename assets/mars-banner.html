        // period, so the mean step is the orbit's circumference / spans.
        const spans = rec.n - 1;
        let arc = 0;
        for (let k = 0; k < spans; k++) {
          arc += Math.hypot(cpos[(k + 1) * 3]     - cpos[k * 3],
                            cpos[(k + 1) * 3 + 1] - cpos[k * 3 + 1],
                            cpos[(k + 1) * 3 + 2] - cpos[k * 3 + 2]);
        }
        const trailPts = Math.max(3, Math.min(PLANET_TRAIL_PTS,
          Math.round(PLANET_TRAIL_LEN / (arc / spans)) + 1));

        let trail;
        {
          const tg  = new THREE.BufferGeometry();
          const tp  = new THREE.BufferAttribute(new Float32Array(trailPts * 3), 3);
          tp.setUsage(THREE.DynamicDrawUsage);
          tg.setAttribute('position', tp);

          // Same fade-to-black ramp as the spacecraft tails: vertex 0 is always
          // the head, so it is fixed in index space and built once.
          const base = new THREE.Color(rec.color);
          const cols = new Float32Array(trailPts * 3);
          for (let i = 0; i < trailPts; i++) {
            const f = Math.pow(1 - i / (trailPts - 1), TRAIL_FALLOFF);
            cols[i * 3]     = base.r * f;
            cols[i * 3 + 1] = base.g * f;
            cols[i * 3 + 2] = base.b * f;
          }
          tg.setAttribute('color', new THREE.BufferAttribute(cols, 3));

          const tm = new THREE.LineBasicMaterial({
            vertexColors: true, transparent: true, opacity: 0, depthWrite: false,
          });
          solarMats.push({ mat: tm, peak: 0.9 });
          trail = new THREE.Line(tg, tm);
          trail.frustumCulled = false;      // rewritten every frame
          solarGroup.add(trail);
        }

        planets.push({
          name: rec.name, cpos, n: rec.n, periodDays: rec.periodDays,
          label: makeLabel(rec.label, rec.color, 'pl-label'),
          body, trail, trailPts, isHero,
          spin: 0.06 + Math.random() * 0.05,   // decorative, see the loop
        });
      }

      // Sun at the solar-system origin, inside solarGroup so the Mars-centring
      // translation carries it along.
      const sunGeo = new THREE.BufferGeometry();
      sunGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3));
      sunGeo.setAttribute('aColor',   new THREE.Float32BufferAttribute([1.0, 0.95, 0.80], 3));
      sunGeo.setAttribute('aSize',    new THREE.Float32BufferAttribute([16], 1));
      sunMat = new THREE.ShaderMaterial({
        uniforms: { uPR: { value: PR }, uOpacity: { value: 0 } },
        vertexShader: PLANET_VERT, fragmentShader: SUN_FRAG,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      });
      solarGroup.add(new THREE.Points(sunGeo, sunMat));
    }

    // ═══════════════════════════════════════════════════════════
    // Labels
    // ═══════════════════════════════════════════════════════════

    const labelHost = document.getElementById('labels');

    function makeLabel(text, color, extraClass) {
      const hex = '#' + color.toString(16).padStart(6, '0');
      const el  = document.createElement('div');
      el.className = 'sc-label' + (extraClass ? ' ' + extraClass : '');
      el.style.visibility = 'hidden';
      el.innerHTML = `<span class="nm" style="color:${hex}">${text}</span>`
                   + `<span class="rd"></span>`
                   + `<span class="st"></span><span class="ut"></span>`;
      labelHost.appendChild(el);
      // The CSS margin offsets the box from the transform origin, so edge
      // clamping has to know it. Read it once here rather than per frame.
      const cs = getComputedStyle(el);
      const mx = parseFloat(cs.marginLeft) || 0;
      const my = parseFloat(cs.marginTop)  || 0;
      return {
        el, rd: el.querySelector('.rd'),
        st: el.querySelector('.st'), ut: el.querySelector('.ut'),
        // mx/my are live: centerLabel() swaps in half the measured box. mx0/my0
        // keep what the stylesheet asked for, so the offset form restores exactly.
        mx, my, mx0: mx, my0: my,
        w: 0, h: 0,   // measured lazily, refreshed only when the text changes
      };
    }

    // Reading offsetWidth forces layout, so do it only on the ~4 Hz text tick
    // and not on the 60 Hz transform update.
    function measureLabel(label) {
      label.w = label.el.offsetWidth;
      label.h = label.el.offsetHeight;
    }

    // A centred label sits on its body rather than beside it, so what places it
    // is half its own box — which changes with the text, hence here and not in
    // the stylesheet. It goes through the same channel the stylesheet margins
    // use, so placeLabel's edge clamp keeps working and the 60 Hz path stays a
    // single transform. Call it after measureLabel, which supplies the box.
    function centerLabel(label, on) {
      if (on) {
        label.mx = -label.w / 2;
        // Vertically it straddles the anchor on a landscape frame and hangs below
        // it on a portrait one, blended by the same portraitness() the framing
        // uses. On a phone the title takes three lines, which pushes the buttons
        // down to within a few pixels of Mars' centre — straddling put the radii
        // line straight through the API reference button's lower border, and that
        // button is transparent, so the text read through it rather than behind
        // it. Hanging below clears the whole chrome column while keeping the
        // anchor where it belongs: on the globe's centre.
        label.my = -label.h / 2 + (label.h / 2 + 3) * portraitness();
        label.el.style.margin = `${label.my.toFixed(1)}px 0 0 ${label.mx.toFixed(1)}px`;
      } else {
        label.mx = label.mx0;
        label.my = label.my0;
        label.el.style.margin = '';
      }
    }

    const pad2 = n => String(n).padStart(2, '0');

    function fmtUtc(ms, withTime) {
      const d = new Date(ms);
      const date = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
      if (!withTime) return date;
      return `${date} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}Z`;
    }

    // Mars' two forms. Constant text, so it is built once; the radii are the
    // same PCK figures the hero globe's own shape comes from, which is the whole
    // reason this label can state them.
    const MARS_RADII = `Re ${MARS_EQ_R.toFixed(2)} km · Rp ${MARS_PO_R.toFixed(2)} km`;

    // Guarded on the form already showing, because the swap writes text, toggles
    // a class and forces a measure. It happens once per crossing, at a zoom where
    // both fades are under a tenth, rather than every frame.
    function setMarsForm(label, hero) {
      if (label.hero === hero) return;
      label.hero = hero;
      label.el.classList.toggle('centered', hero);
      label.rd.textContent = hero ? MARS_RADII : '';
      measureLabel(label);
      centerLabel(label, hero);
    }

    // ═══════════════════════════════════════════════════════════
    // Spacecraft
    // ═══════════════════════════════════════════════════════════

    const craft = [];   // [{ rec, pos, n, index, frac, dot, trail, label }]

    function buildCraft(recs) {
      for (const rec of recs) {
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.013, 10, 8),
          new THREE.MeshBasicMaterial({ color: rec.color }),
        );
        scene.add(dot);

        const trailGeo = new THREE.BufferGeometry();
        const posAttr  = new THREE.BufferAttribute(new Float32Array(TRAIL_LEN * 3), 3);
        posAttr.setUsage(THREE.DynamicDrawUsage);
        trailGeo.setAttribute('position', posAttr);

        // Vertex 0 is always the head, so the brightness ramp is fixed in index
        // space and only needs building once. Fading toward black reads as a
        // fade to transparent against the dark backdrop.
        const base = new THREE.Color(rec.color);
        const cols = new Float32Array(TRAIL_LEN * 3);
        for (let i = 0; i < TRAIL_LEN; i++) {
          const fade = Math.pow(1 - i / (TRAIL_LEN - 1), TRAIL_FALLOFF);
          cols[i * 3]     = base.r * fade;
          cols[i * 3 + 1] = base.g * fade;
          cols[i * 3 + 2] = base.b * fade;
        }
        trailGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        trailGeo.setDrawRange(0, 0);

        const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
          vertexColors: true, transparent: true, opacity: 0.95,
        }));
        trail.frustumCulled = false;
        scene.add(trail);

        craft.push({
          name: rec.name, target: rec.target, mission: rec.mission,
          startMs: Date.parse(rec.startUtc), startEt: rec.startEt, stepSec: rec.stepSec,
          windowSec: rec.windowSec, nRecords: rec.n,
          pos: scaleToWorld(floats(rec.xyz)), n: rec.n,
          index: 0, frac: 0, live: false,
          dot, trail, label: makeLabel(rec.label, rec.color),
        });
      }
    }

    // km → world units, in place
    function scaleToWorld(f) {
      for (let i = 0; i < f.length; i++) f[i] *= SCALE;
      return f;
    }

    // Radius of the reference spheroid at a given planetocentric latitude, so the
    // reported altitude accounts for Mars' polar flattening.
    function spheroidRadius(sinLat) {
      const a2 = MARS_EQ_R * MARS_EQ_R;
      const b2 = MARS_PO_R * MARS_PO_R;
      const s2 = sinLat * sinLat;
      return (MARS_EQ_R * MARS_PO_R) / Math.sqrt(b2 * (1 - s2) + a2 * s2);
    }

    // Mars' north pole as a unit vector in J2000, which is the frame the
    // spacecraft vectors arrive in. Latitude is the angle out of Mars' equator,
    // so it is this direction the position has to be projected onto — NOT a
    // coordinate axis, since the pole is 37° off J2000 +z.
    // RA 317.68143°, Dec 52.88650°: the values the REST API's own kernels use.
    // Recovered by querying MRO in both IAU_MARS and J2000 over the same 300
    // epochs and least-squares solving p from p · r_J2000 = z_IAU_MARS; the
    // result lands 0.02° from these constants, and reproduces SPICE's own
    // planetocentric latitude to within 13 m of altitude for all five craft.
    // (Note this is the older IAU-2000 pole, not pck00011's 317.269/54.433 —
    // that one is off by 1.6° in Dec here and would put the altitude out by km.)
    const MARS_POLE = (() => {
      const ra = 317.68143 * Math.PI / 180, dec = 52.88650 * Math.PI / 180;
      return {
        x: Math.cos(dec) * Math.cos(ra),
        y: Math.cos(dec) * Math.sin(ra),
        z: Math.sin(dec),
      };
    })();

    // ═══════════════════════════════════════════════════════════
    // Data loading — cached SpiceQL first, live SpiceQL on top
    // ═══════════════════════════════════════════════════════════

    const statusEl = document.getElementById('status');
    const bannerEl = document.getElementById('banner');

    function setStatus(state, title) {
      statusEl.className = state;
      statusEl.title = title;
      statusEl.querySelector('.txt').textContent =
        state === 'live' ? 'SpiceQL live' : state === 'cache' ? 'SpiceQL cached' : 'SpiceQL';
      // The caption's second line claims the render is live, so it is tied to
      // the same verdict as the green dot rather than set independently.
      bannerEl.classList.toggle('is-live', state === 'live');
    }

    let cacheMeta = null;

    async function loadCache() {
      const r = await fetch(CACHE_URL, { cache: 'force-cache' });
      if (!r.ok) throw new Error(`cache ${r.status}`);
      const doc = mpDecode(await r.arrayBuffer());
      cacheMeta = doc;

      // One epoch or nothing: the scene shows a single instant, so a craft whose
      // buffer starts anywhere else cannot be on it and is dropped rather than
      // drawn at a date the rest of the frame is not showing. That rules out the
      // early missions — MGS and Viking 1 ended before Odyssey's kernels begin,
      // so no epoch exists that covers them alongside the current three. The
      // check is on the cache's own field rather than a name list so the page
      // stays correct whatever a regenerated cache happens to hold.
      const syncMs = Date.parse(doc.syncEpochUtc);
      buildCraft(doc.spacecraft.filter(r => Date.parse(r.startUtc) === syncMs));

      // Seed the clock where the craft buffers begin, so the opening frame is
      // already in sync rather than winding up to it — offset to the instant that
      // frames all three craft. See START_OFFSET_SEC.
      simMs = syncMs + START_OFFSET_SEC * 1000;
      planetStartMs = Date.parse(doc.planets[0].startUtc);
      buildSolarSystem(doc.planets);
    }

    async function fetchStatesRanged(c) {
      const url = new URL(`${SPICEQL}/getTargetStatesRanged`);
      // Re-query the cache's own epoch and window: that epoch is known to be
      // covered by the server's kernels, where "now" is not for most of these
      // missions, and matching the window keeps stepSec — and therefore the
      // playback rate — identical when the live buffer swaps in.
      url.searchParams.set('startEt',       String(c.startEt));
      url.searchParams.set('stopEt',        String(c.startEt + c.windowSec));
      url.searchParams.set('numRecords',    String(c.nRecords));
      url.searchParams.set('target',        c.target);
      url.searchParams.set('observer',      'MARS');
      url.searchParams.set('frame',         'J2000');
      url.searchParams.set('mission',       c.mission);
      url.searchParams.set('abcorr',        'NONE');
      url.searchParams.set('searchKernels', 'true');
      const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(`getTargetStatesRanged ${r.status}`);
      // Each element: [x, y, z, vx, vy, vz, lt] in km
      const rows = (await r.json()).body.return;
      if (!Array.isArray(rows) || rows.length < 2) throw new Error('empty response');
      const out = new Float32Array(rows.length * 3);
      for (let i = 0; i < rows.length; i++) {
        out[i * 3]     = rows[i][0] * SCALE;
        out[i * 3 + 1] = rows[i][1] * SCALE;
        out[i * 3 + 2] = rows[i][2] * SCALE;
      }
      return { pos: out, n: rows.length };
    }

    // Planets are deliberately not re-fetched: planetary ephemerides are
    // deterministic, so a live call would return exactly the cached values at
    // the cost of eight long-span queries on every page load.
    async function trySpiceQL() {
      const results = await Promise.allSettled(craft.map(async c => {
        const { pos, n } = await fetchStatesRanged(c);
        // No playhead to rescale: the craft loop derives its index from the clock
        // and the buffer's own epoch, so the swap only has to leave those two
        // consistent. stepSec is recomputed because the server is free to return
        // a different row count than it was asked for, and the step is what turns
        // an epoch into an index — take the cached one with a shorter buffer and
        // the craft would fly at the wrong speed.
        c.pos     = pos;
        c.n       = n;
        c.stepSec = c.windowSec / (n - 1);
        c.live    = true;
      }));

      const ok = results.filter(r => r.status === 'fulfilled').length;
      const sync = cacheMeta?.syncEpochUtc?.slice(0, 10) ?? '';
      if (ok === craft.length) {
        setStatus('live',
          `Live SpiceQL: all ${ok} orbits fetched from the REST API.\n` +
          `Every body shown at one epoch, ${sync}.`);
      } else {
        setStatus('cache',
          `SpiceQL API unreachable for ${craft.length - ok} of ${craft.length} orbits — ` +
          `showing cached SPICE data bundled with the docs.`);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // Per-frame label placement
    // ═══════════════════════════════════════════════════════════

    const projected = new THREE.Vector3();

    const hideLabel = label => { label.el.style.visibility = 'hidden'; };

    // Labels are placed at their body and left free to overlap. Nudging them
    // apart was worse: it moved text away from the dot it annotates, so a
    // reader could not tell which label belonged to which craft.
    //
    // A body that leaves the frame keeps its label, pinned to the edge it went
    // out of, so its direction relative to the current view stays readable.
    // Pinned labels are dimmed, because at the edge they no longer sit on the
    // thing they describe and should not look like they annotate what is there.
    const EDGE_PAD = 6, PINNED_DIM = 0.55;

    function placeLabel(label, v, fade) {
      if (fade <= 0.02) { hideLabel(label); return false; }
      projected.copy(v).project(camera);

      let nx = projected.x, ny = projected.y;
      // Behind the camera the perspective divide mirrors x and y, so a body
      // over your shoulder projects to the opposite side of the frame. Flip it
      // back and push it onto the unit square so the clamp drives it to the
      // edge it actually lies past.
      if (projected.z > 1) {
        const s = Math.max(Math.abs(nx), Math.abs(ny)) || 1;
        nx = -nx / s;
        ny = -ny / s;
      }

      if (!label.w) measureLabel(label);
      // Transform origin, then the box the margin puts it in
      let sx = (nx * 0.5 + 0.5) * W;
      let sy = (-ny * 0.5 + 0.5) * H;
      const maxX = Math.max(EDGE_PAD, W - label.w - EDGE_PAD);
      const maxY = Math.max(EDGE_PAD, H - label.h - EDGE_PAD);
      const cx = Math.min(Math.max(sx + label.mx, EDGE_PAD), maxX) - label.mx;
      const cy = Math.min(Math.max(sy + label.my, EDGE_PAD), maxY) - label.my;
      const pinned = cx !== sx || cy !== sy;

      label.el.style.transform  = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px)`;
      label.el.style.opacity    = (pinned ? fade * PINNED_DIM : fade).toFixed(2);
      label.el.style.visibility = 'visible';
      return true;
    }

    // ═══════════════════════════════════════════════════════════
    // Animation loop
    // ═══════════════════════════════════════════════════════════

    const clock  = new THREE.Clock();
    const marsC  = new THREE.Vector3();   // compressed Mars, i.e. the Sun's offset
    const bodyW  = new THREE.Vector3();
    let textTimer = 0, elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      elapsed += dt;

      for (const m of starMats) m.uniforms.uTime.value = elapsed;

      marsGroup.rotation.y += dt * 0.021;
      starField.rotation.y += dt * 0.0016; // barely-there drift so it feels alive

      // The solar layer only earns screen space once you pull back, so the hero
      // framing at the default zoom is untouched. The fade-in window tracks
      // LOG_K: the layout now runs out to 112 u, so arriving any earlier just
      // means a frame of empty space with every label pinned to an edge.
      const z         = Math.abs(camera.position.z);
      const solarFade = smoothstep(21, 42, z);
      const craftFade = 1 - smoothstep(14, 24, z);
      updateCameraTarget();

      // The one clock, advanced once per frame. Both layers read simMs below
      // rather than stepping themselves.
      simMs += dt * 1000 * TIME_RATE;
      const simDays = (simMs - planetStartMs) / 86400000;

      textTimer += dt;
      const refreshText = textTimer >= 0.25;   // ~4×/s keeps the digits legible
      if (refreshText) textTimer = 0;

      // ── Planets ──
      if (planets.length) {
        sunMat.uniforms.uOpacity.value = solarFade;
        for (const s of solarMats) s.mat.opacity = solarFade * s.peak;
        const solarVisible = solarFade > 0.02;

        for (const p of planets) {
          // Every buffer spans exactly one period from the same start epoch, so
          // an absolute epoch indexes them all at a single consistent instant —
          // and since it is a phase into a periodic buffer rather than a walk
          // along it, simMs can sit anywhere, including years after the epoch the
          // planets were sampled at. That is what lets the craft's 2023 sync
          // epoch drive these 2020-based buffers with no regeneration.
          const spans = p.n - 1;
          const phase = ((simDays % p.periodDays) + p.periodDays) % p.periodDays;
          const u  = (phase / p.periodDays) * spans;
          const i0 = Math.floor(u) % spans;
          const i1 = (i0 + 1) % spans;
          const f  = u - Math.floor(u);
          const x = p.cpos[i0 * 3]     + (p.cpos[i1 * 3]     - p.cpos[i0 * 3])     * f;
          const y = p.cpos[i0 * 3 + 1] + (p.cpos[i1 * 3 + 1] - p.cpos[i0 * 3 + 1]) * f;
          const zc = p.cpos[i0 * 3 + 2] + (p.cpos[i1 * 3 + 2] - p.cpos[i0 * 3 + 2]) * f;
          p.x = x; p.y = y; p.z = zc;

          if (p.isHero) marsC.set(x, y, zc);

          // At the resting zoom this layer is invisible, and that is the frame
          // almost everyone sees — so stop before the per-frame buffer writes.
          if (!solarVisible) {
            if (p.body) p.body.visible = false;
            p.trail.visible = false;
            continue;
          }

          // Mars has no body of its own — the hero globe is standing in for it,
          // and the centring translation parks this trail's head right on it.
          if (p.body) {
            p.body.position.set(x, y, zc);
            p.body.visible = true;
            // Decorative, like the hero globe's own spin. The real rotation rates
            // are not what this clock is for — at 600x Earth would take two and a
            // half minutes to turn once, on a sphere a few pixels across.
            p.body.rotation.y += dt * p.spin;
          }

          // Trail: interpolated head, then the samples behind it
          const arr = p.trail.geometry.attributes.position.array;
          arr[0] = x; arr[1] = y; arr[2] = zc;
          for (let i = 1; i < p.trailPts; i++) {
            const k = ((i0 - i + 1) % spans + spans) % spans;
            arr[i * 3]     = p.cpos[k * 3];
            arr[i * 3 + 1] = p.cpos[k * 3 + 1];
            arr[i * 3 + 2] = p.cpos[k * 3 + 2];
          }
          p.trail.geometry.attributes.position.needsUpdate = true;
          p.trail.visible = true;
        }

        // Mars sits at the world origin at every zoom level, so the camera has
        // something fixed to hold centre on however far back it pulls.
        solarGroup.position.set(-marsC.x, -marsC.y, -marsC.z);
        solarFrame.updateMatrixWorld(true);

        for (const p of planets) {
          bodyW.set(p.x, p.y, p.z).applyMatrix4(solarGroup.matrixWorld);

          // Mars reads as one of the eight when you are pulled back, and this is
          // the one place it stops: once it fills the frame the other labels are
          // gone and it is the subject, so the same element moves onto the globe's
          // centre and opens up. The anchor needs no special case — Mars holds the
          // world origin, so bodyW already projects to the centre of the globe.
          // The handover rides the two fades that gate the layers either side of
          // it, crossing at z = 24 where both are still under a tenth, so it is
          // not a swap you can catch.
          const hero = p.isHero && craftFade > 0.02;
          if (p.isHero) setMarsForm(p.label, hero);

          if (!placeLabel(p.label, bodyW, hero ? craftFade : solarFade)) continue;
          if (refreshText) {
            // Report the true radius, not the compressed one drawn on screen:
            // invert rw = K·log10(1 + rAu/C)
            const rw  = Math.hypot(p.x, p.y, p.z);
            const rAu = (Math.pow(10, rw / LOG_K) - 1) * LOG_C;
            p.label.st.textContent = `${rAu.toFixed(2)} AU`;
            // The same simMs, in the same form, as every spacecraft label below:
            // one instant, reported one way, so the two layers can be read
            // against each other rather than compared. The time of day stays on
            // even pulled back, where the planets are barely moving — it is the
            // line that says the whole frame is one epoch.
            p.label.ut.textContent = fmtUtc(simMs, true);
            measureLabel(p.label);
            if (hero) centerLabel(p.label, true);
          }
        }
      }

      // ── Spacecraft ──
      for (const c of craft) {
        if (c.n < 2) continue;
        const len = c.n;
        // Derived from the clock, not accumulated against it. Every craft was
        // sampled at the same epoch, so they all sit at the same offset into
        // their own buffer and stay locked to each other and to the planets
        // whatever the rate does. It also means a buffer swap needs no playhead
        // rescale — the epoch decides where the head lands.
        //
        // The buffer holds a whole number of orbits, so wrapping the offset back
        // to its start is very nearly continuous: the craft returns to the same
        // point in its orbit, a few orbits' worth of precession short.
        const u = ((((simMs - c.startMs) / 1000 / c.stepSec) % len) + len) % len;
        c.index = Math.floor(u);
        c.frac  = u - c.index;

        // Lerp between the current sampled position and the next
        const i0 = c.index * 3;
        const i1 = ((c.index + 1) % len) * 3;
        const f  = c.frac;
        const hx = c.pos[i0]     + (c.pos[i1]     - c.pos[i0])     * f;
        const hy = c.pos[i0 + 1] + (c.pos[i1 + 1] - c.pos[i0 + 1]) * f;
        const hz = c.pos[i0 + 2] + (c.pos[i1 + 2] - c.pos[i0 + 2]) * f;
        c.dot.position.set(hx, hy, hz);
        c.dot.visible   = craftFade > 0.02;
        c.trail.visible = craftFade > 0.02;

        // Trail: interpolated head first, then previous sampled positions
        const arr   = c.trail.geometry.attributes.position.array;
        const count = Math.min(TRAIL_LEN, len);
        arr[0] = hx; arr[1] = hy; arr[2] = hz;
        for (let i = 1; i < count; i++) {
          const k = (((c.index - i + 1) % len) + len) % len;
          arr[i * 3]     = c.pos[k * 3];
          arr[i * 3 + 1] = c.pos[k * 3 + 1];
          arr[i * 3 + 2] = c.pos[k * 3 + 2];
        }
        c.trail.geometry.attributes.position.needsUpdate = true;
        c.trail.geometry.setDrawRange(0, count);
        c.trail.material.opacity = 0.95 * craftFade;

        const shown = placeLabel(c.label, c.dot.position, craftFade);

        if (shown && refreshText) {
          const r    = Math.hypot(hx, hy, hz);
          const rKm  = r * MARS_EQ_R;
          // sin(latitude) is the position's component ALONG MARS' POLE, not along
          // any J2000 axis. Getting this wrong reads low by up to 18 km, since it
          // under-applies the flattening: MRO's polar orbit came out 234–302 km
          // instead of SPICE's own 251–317 km.
          const sinLat = (hx * MARS_POLE.x + hy * MARS_POLE.y + hz * MARS_POLE.z) / r;
          const alt  = rKm - spheroidRadius(sinLat);
          const lat  = THREE.MathUtils.radToDeg(Math.asin(sinLat));
          c.label.st.textContent =
            `ALT ${alt.toFixed(0).padStart(5)} km  LAT ${lat >= 0 ? '+' : ''}${lat.toFixed(1)}°`;
          // The scene's one epoch, not a per-craft one: every craft on screen was
          // sampled at the same sync epoch, so this is the same value the planet
          // labels show, to the second.
          c.label.ut.textContent = fmtUtc(simMs, true);
          measureLabel(c.label);
        }
      }

      // Scene offscreen, then the chain: bright pass, the two blur axes, and a
      // final quad to the canvas. The blurs ping-pong between the two small
      // targets so the vertical one ends where uBloom is already pointed.
      //
      // Both effects can be switched off, and with neither left there is no chain
      // to run: the scene draws straight to the canvas and the frame costs one
      // pass instead of five. That is also the only path where three.js does the
      // sRGB encode itself, because it is the only one where it is the thing
      // drawing to the canvas.
      //
      // It is the only path with antialiasing, too, and that is visible: the
      // canvas was asked for it, crtTarget has no multisampling, so the wireframe
      // comes out smoother here than under either filtered path. Measured, the
      // difference is confined to line edges — the flat background is identical to
      // a level. Fixable with `samples: 4` on crtTarget, at the cost of a
      // multisampled full-resolution target on every frame including the normal
      // one; left alone because the scanlines are sitting on those same edges
      // whenever the filter is on.
      const bloomOn = BLOOM.enabled && BLOOM.strength > 0;
      if (!CRT.enabled && !bloomOn) {
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
        return;
      }

      renderer.setRenderTarget(crtTarget);
      renderer.render(scene, camera);

      // Skipped at strength 0 rather than run and multiplied away. It leaves a
      // stale frame in the target, which is why the guard is on the strength the
      // final pass scales by: zero of a stale glow is still zero.
      if (bloomOn) {
        pass(brightMat, bloomTargets[0]);
        blurMat.uniforms.uTex.value = bloomTargets[0].texture;
        blurMat.uniforms.uStep.value.set(bloomTexel.x, 0);
        pass(blurMat, bloomTargets[1]);
        blurMat.uniforms.uTex.value = bloomTargets[1].texture;
        blurMat.uniforms.uStep.value.set(0, bloomTexel.y);
        pass(blurMat, bloomTargets[0]);
      }

      crtMat.uniforms.uTime.value = elapsed;
      pass(CRT.enabled ? crtMat : flatMat, null);
    }

    // ═══════════════════════════════════════════════════════════
    // Zoom
    // ═══════════════════════════════════════════════════════════

    const zoomInput = document.getElementById('zoom');
    zoomInput.max   = ZOOM_MAX;             // set before value, or it clamps
    zoomInput.value = camera.position.z;     // restingDist() owns the framing

    // Once the slider has been dragged, the resting distance stops being ours to
    // change, so a later resize leaves the chosen zoom alone.
    let zoomTouched = false;

    zoomInput.addEventListener('input', function () {
      zoomTouched = true;
      camera.position.z = parseFloat(this.value);
      updateCameraTarget();
    });

    // ═══════════════════════════════════════════════════════════
    // Resize
    // ═══════════════════════════════════════════════════════════

    const resizeObs = new ResizeObserver(() => {
      W = canvas.parentElement.clientWidth  || window.innerWidth;
      H = canvas.parentElement.clientHeight || window.innerHeight;
      renderer.setSize(W, H, false);
      // Drawing-buffer pixels, not CSS pixels, or the pass resamples at the
      // wrong scale on a retina display.
      crtTarget.setSize(Math.round(W * PR), Math.round(H * PR));
      resizeBloom();
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      // Rotating a phone changes the aspect, and with it how far back the globe
      // has to sit to fit the frame.
      if (!zoomTouched) {
        camera.position.z = restingDist();
        zoomInput.value   = camera.position.z;
      }
      updateCameraTarget();
    });
    resizeObs.observe(document.getElementById('banner'));

    // ═══════════════════════════════════════════════════════════
    // Bootstrap: cached SPICE renders immediately, live SpiceQL layers on top
    // ═══════════════════════════════════════════════════════════

    animate();

    loadCache()
      .then(() => {
        // Stay on the neutral pulse until the API verdict is in, so the dot
        // never flashes "failed" during a request that is about to succeed.
        setStatus('probing', 'Cached SPICE data rendering — contacting the SpiceQL API…');
        return trySpiceQL();
      })
      .catch(err => {
        setStatus('cache', `Ephemeris cache failed to load: ${err.message}`);
        console.error('[mars-banner]', err);
      });
  </script>
</body>
</html>
